<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中医辨证调养助手 · 说人话就能用</title>
<meta name="description" content="用日常口语描述身体不适，得到可能的证型、辨证依据和可执行的调养建议。41 种证型 / 61 首经典方 / 38 个穴位 / 14 道食疗方。">
<link rel="stylesheet" href="style.css?v=10">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
</head>
<body>
<div class="bg-grid" aria-hidden="true"></div>

<header class="hero">
  <svg class="herb herb-l" viewBox="0 0 140 200" aria-hidden="true">
    <path d="M70 196 C66 150 62 118 48 84" stroke="#7a6b3f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M62 132 C48 122 30 120 18 128 C30 140 50 142 62 132Z" fill="#6f8f52" opacity=".85"/>
    <path d="M66 118 C82 108 100 108 112 116 C99 128 79 129 66 118Z" fill="#5f7f45" opacity=".8"/>
    <path d="M58 104 C44 94 28 93 17 100 C29 112 47 113 58 104Z" fill="#6f8f52" opacity=".8"/>
    <path d="M62 92 C76 82 92 82 103 89 C91 101 73 101 62 92Z" fill="#5f7f45" opacity=".75"/>
    <path d="M48 84 C42 66 40 50 44 36" stroke="#7a6b3f" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="86" cy="72" r="6.5" fill="#b8382c" opacity=".9"/>
    <circle cx="104" cy="86" r="5.5" fill="#c2453a" opacity=".85"/>
    <circle cx="28" cy="66" r="5.5" fill="#b8382c" opacity=".8"/>
    <circle cx="44" cy="34" r="5" fill="#c2453a" opacity=".85"/>
  </svg>

  <svg class="herb herb-r" viewBox="0 0 160 200" aria-hidden="true">
    <g opacity=".9">
      <ellipse cx="60" cy="70" rx="34" ry="22" fill="#d8c193"/>
      <ellipse cx="60" cy="70" rx="34" ry="22" fill="none" stroke="#a98f5c" stroke-width="1.6"/>
      <ellipse cx="60" cy="70" rx="22" ry="13" fill="none" stroke="#b89c68" stroke-width="1.2"/>
      <ellipse cx="60" cy="70" rx="10" ry="6" fill="none" stroke="#b89c68" stroke-width="1"/>
    </g>
    <g opacity=".75" transform="translate(22 44) rotate(18)">
      <ellipse cx="60" cy="70" rx="30" ry="19" fill="#e0cba1"/>
      <ellipse cx="60" cy="70" rx="30" ry="19" fill="none" stroke="#a98f5c" stroke-width="1.5"/>
      <ellipse cx="60" cy="70" rx="18" ry="10" fill="none" stroke="#b89c68" stroke-width="1"/>
    </g>
    <g opacity=".85">
      <circle cx="60" cy="144" r="9" fill="#b8382c" opacity=".78"/>
      <circle cx="86" cy="156" r="7" fill="#c2453a" opacity=".72"/>
      <circle cx="40" cy="160" r="6" fill="#b8382c" opacity=".6"/>
    </g>
  </svg>

  <h1>中医辨证调养助手</h1>
  <p class="sub">用身体感受说话，给你一个可执行的调养方向</p>
  <p class="meta"><b>41</b> 种证型 · <b>61</b> 首经典方 · <b>38</b> 个穴位 · <b>14</b> 道食疗方</p>
  <div class="seal" aria-hidden="true">辨证<br>论治</div>
</header>

<main>
  <section class="input-card">
    <label for="symptoms">你的身体感受</label>
    <textarea id="symptoms" rows="3"
      placeholder="例：最近总睡不着，白天没劲，大便也不成形"></textarea>

    <div class="examples">
      <span>试试：</span>
      <button class="ex" data-text="失眠 多梦 心烦 舌尖红">失眠多梦</button>
      <button class="ex" data-text="吃不下饭 人也没劲 大便稀">脾虚乏力</button>
      <button class="ex" data-text="怕冷 没汗 头痛 流清涕">风寒感冒</button>
      <button class="ex" data-text="情绪不好 爱叹气 两肋胀">肝郁气滞</button>
    </div>

    <div class="chips">
      <span class="chips-label">或直接点选：</span>
      <div id="chips" class="chips-list"></div>
    </div>

    <button id="go" class="go">开始分析</button>
  </section>

  <section id="result" class="result" hidden></section>
</main>

<footer>
  <p><b>本工具仅用于中医知识学习与养生参考，不构成医疗诊断，不替代专业医师诊疗。</b></p>
  <p>有胸痛、黑便呕血、突发剧烈头痛、单侧肢体麻木等情况，请直接就医。</p>
  <p class="tiny">
    <a href="https://github.com/leropeter/tcm-agent">GitHub 源码</a> ·
    <a href="EVALUATION.md">评测与局限</a> ·
    数据：TCMEval-SDT 公开数据集 + 公有领域古籍
  </p>
</footer>

<div class="modal" id="modal" hidden>
  <div class="modal-back" data-close></div>
  <div class="modal-panel" role="dialog" aria-modal="true">
    <button class="modal-x" id="modal-x" aria-label="关闭">×</button>
    <div class="modal-content" id="modal-content"></div>
  </div>
</div>

<script src="tcm-engine.js?v=10"></script>
<script src="app.js?v=10"></script>
</body>
</html>
